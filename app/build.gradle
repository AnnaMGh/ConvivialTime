apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
keystoreProperties.load(rootProject.file("keystore/keystore.properties").newDataInputStream())

android {
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.anaghizdavat.activity"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 10
        versionName "1.0.6"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'] ?: "")
            storePassword keystoreProperties['storePassword'] ?: ""
            keyAlias keystoreProperties['keyAlias'] ?: ""
            keyPassword keystoreProperties['keyPassword'] ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false // can't run because because firebase crashlytics
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    flavorDimensions = ["services"]
    productFlavors {
        gms {
            versionCode 10
            versionName "1.0.6"
            dimension "services"
        }
        hms {
            versionCode 10
            versionName "1.0.6"
            dimension "services"
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // This code generates BuildConfig if is not generated by default
    buildFeatures {
        buildConfig = true
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

    namespace 'com.anaghizdavat.activity'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.7.1'


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    //google
//    gmsImplementation 'com.google.android.gms:play-services-ads:24.7.0'
    gmsImplementation platform('com.google.firebase:firebase-bom:34.6.0')
    gmsImplementation 'com.google.firebase:firebase-analytics'
    gmsImplementation 'com.google.firebase:firebase-crashlytics'

    //huawei
    hmsImplementation 'com.huawei.agconnect:agconnect-core:1.4.1.300'
    hmsImplementation 'com.huawei.hms:hianalytics:5.0.0.300'
    hmsImplementation 'com.huawei.hms:dtm-api:4.0.0.300'
    hmsImplementation 'com.huawei.agconnect:agconnect-crash:1.4.1.300'

    //calligraphy
    implementation 'uk.co.chrisjenx:calligraphy:2.3.0'

    //multidex
    implementation 'androidx.multidex:multidex:2.0.1'
}

if (getGradle().getStartParameter().getTaskRequests().toString().toLowerCase().contains("gms")) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
} else {
    apply plugin: 'com.huawei.agconnect'
}
