apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    defaultConfig {
        applicationId "com.anaghizdavat.activity"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 8
        versionName "1.0.4"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            keyAlias 'keyactivitytime'
            keyPassword 'keyAc01'
            storeFile file('D:/Work/Android/Keys/Personal/keyActivityTime.jks')
            storePassword 'keyAc01'
        }
    }

    buildTypes {
        release {
            minifyEnabled false // can't run because because firebase crashlytics
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    flavorDimensions "services"
    productFlavors {
        gms {
            versionCode 9
            versionName "1.0.5"
            dimension "services"
        }
        hms {
            versionCode 10
            versionName "1.0.6"
            dimension "services"
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.3.1'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    //google
    gmsImplementation 'com.google.android.gms:play-services-ads:19.8.0'
    gmsImplementation 'com.google.firebase:firebase-core:19.0.2'
    gmsImplementation 'com.google.firebase:firebase-analytics:19.0.2'
    gmsImplementation 'com.google.firebase:firebase-crashlytics:18.2.3'
    gmsImplementation 'com.google.firebase:firebase-crashlytics:18.2.3'

    //huawei
    hmsImplementation 'com.huawei.agconnect:agconnect-core:1.4.1.300'
    hmsImplementation 'com.huawei.hms:hianalytics:5.0.0.300'
    hmsImplementation 'com.huawei.hms:dtm-api:4.0.0.300'
    hmsImplementation 'com.huawei.agconnect:agconnect-crash:1.4.1.300'

    //appsflyer
    implementation 'com.appsflyer:af-android-sdk:6.3.2'

    //calligraphy
    implementation 'uk.co.chrisjenx:calligraphy:2.3.0'

    //butter knife
    implementation 'com.jakewharton:butterknife:10.2.0'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.0'

    //multidex
    implementation 'androidx.multidex:multidex:2.0.1'
}

if (getGradle().getStartParameter().getTaskRequests().toString().toLowerCase().contains("gms")) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
} else {
    apply plugin: 'com.huawei.agconnect'
}
