apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    defaultConfig {
        applicationId "com.anaghizdavat.activity"
        minSdkVersion 17
        targetSdkVersion 29
        versionCode 7
        versionName "1.0.3"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            keyAlias 'keyactivitytime'
            keyPassword 'keyAc01'
            storeFile file('D:/Work/Android/Keys/Personal/keyActivityTime.jks')
            storePassword 'keyAc01'
        }
    }

    buildTypes {
        release {
            minifyEnabled false // can't run because because firebase crashlytics
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    flavorDimensions "services"
    productFlavors {
        gms {
            dimension "services"
        }
        hms {
            dimension "services"
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    //google
    gmsImplementation 'com.google.android.gms:play-services-ads:19.3.0'
    gmsImplementation 'com.google.firebase:firebase-core:17.5.0'
    gmsImplementation 'com.google.firebase:firebase-analytics:17.5.0'
    gmsImplementation 'com.google.firebase:firebase-crashlytics:17.2.1'

    //huawei
    hmsImplementation 'com.huawei.agconnect:agconnect-core:1.3.1.300'
    hmsImplementation 'com.huawei.hms:hianalytics:4.0.0.300'

    //calligraphy
    implementation 'uk.co.chrisjenx:calligraphy:2.3.0'

    //butter knife
    implementation 'com.jakewharton:butterknife:10.2.0'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.0'

    //multidex
    implementation 'androidx.multidex:multidex:2.0.1'
}

if (getGradle().getStartParameter().getTaskRequests().toString().toLowerCase().contains("gms")) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
} else {
    apply plugin: 'com.huawei.agconnect'
}
